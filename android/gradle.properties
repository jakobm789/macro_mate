org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=io.flutter,flutter_embedding,x86_64,arm64,armeabi
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# The project and Pub cache live on different Windows drives. In-process,
# non-incremental Kotlin compilation avoids cross-drive cache path failures.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
