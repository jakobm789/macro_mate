name: One-time account setup

on:
  push:
    branches:
      - codex/create-account-20261002
    paths:
      - ".github/workflows/one-time-account-20261002.yml"

permissions: {}

jobs:
  create-account:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ secrets.POSTGRES_HOST }}
      PGPORT: ${{ secrets.POSTGRES_PORT }}
      PGUSER: ${{ secrets.POSTGRES_USER }}
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGDATABASE: ${{ secrets.POSTGRES_DB }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "20"
      TARGET_EMAIL: moehlenkamp11@gmail.com
      TARGET_PASSWORD_HASH: ${{ secrets.TEMP_ACCOUNT_PASSWORD_HASH_20261002 }}
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Create exactly one new verified account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_PASSWORD_HASH"
          psql -X -v ON_ERROR_STOP=1 \
            -v target_email="$TARGET_EMAIL" \
            -v target_password_hash="$TARGET_PASSWORD_HASH" <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout = '15s';
          SET LOCAL statement_timeout = '30s';
          LOCK TABLE users IN SHARE ROW EXCLUSIVE MODE;
          WITH inserted AS (
            INSERT INTO users (email, password_hash, is_verified)
            SELECT :'target_email', :'target_password_hash', true
            WHERE NOT EXISTS (
              SELECT 1 FROM users WHERE LOWER(email) = LOWER(:'target_email')
            )
            RETURNING 1
          )
          SELECT COUNT(*) = 1 AS account_ready FROM inserted
          \gset
          \if :account_ready
          COMMIT;
          \else
          ROLLBACK;
          \echo 'Account already exists; no account was changed.'
          \quit 1
          \endif
          SQL
          echo "Account setup completed and verified for exactly one account."
