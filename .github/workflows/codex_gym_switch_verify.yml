name: Codex Gym Switch Verification

on:
  push:
    branches:
      - codex/gym-exercise-switch-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/gym/presentation/gym_controller.dart lib/features/gym/presentation/workout_runner_page.dart test/features/gym/ai_coach_engine_test.dart
      - run: flutter test test/features/gym/ai_coach_engine_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-gym-exercise-switch
          path: |
            lib/features/gym/presentation/gym_controller.dart
            lib/features/gym/presentation/workout_runner_page.dart
            test/features/gym/ai_coach_engine_test.dart
          if-no-files-found: error
