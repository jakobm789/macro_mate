name: One-time password reset

on:
  push:
    branches:
      - codex/reset-lena-password-20260915
    paths:
      - ".github/workflows/reset-lena-password.yml"

permissions: {}

jobs:
  reset-password:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ secrets.POSTGRES_HOST }}
      PGPORT: ${{ secrets.POSTGRES_PORT }}
      PGUSER: ${{ secrets.POSTGRES_USER }}
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGDATABASE: ${{ secrets.POSTGRES_DB }}
      PGSSLMODE: require
      TARGET_EMAIL: lenawestermann15.09@gmail.com
      TARGET_PASSWORD_HASH: "$2b$12$i.8CBAbX.oCF3WfGF8S/4.9IV4uWP8ww0fDmz4uMQCuYQAcMlxT3."
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Reset password
        shell: bash
        run: |
          set -euo pipefail
          changed="$(
            psql -X -A -t -v ON_ERROR_STOP=1 \
              -v target_email="$TARGET_EMAIL" \
              -v target_password_hash="$TARGET_PASSWORD_HASH" <<'SQL'
          WITH updated AS (
            UPDATE users
            SET password_hash = :'target_password_hash'
            WHERE LOWER(email) = LOWER(:'target_email')
            RETURNING 1
          )
          SELECT COUNT(*) FROM updated;
          SQL
          )"
          test "$changed" = "1"
          echo "Password reset completed for one account."
