name: MacroMate CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - 'codex/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Flutter Analyze, Test & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
      JAVA_OPTS: "-Xmx4096m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis (Strict)
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Build Android Release APK
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          DART_DEFINES=()
          [ -n "$POSTGRES_HOST" ] && DART_DEFINES+=(--dart-define=POSTGRES_HOST="$POSTGRES_HOST")
          [ -n "$POSTGRES_PORT" ] && DART_DEFINES+=(--dart-define=POSTGRES_PORT="$POSTGRES_PORT")
          [ -n "$POSTGRES_DB" ] && DART_DEFINES+=(--dart-define=POSTGRES_DB="$POSTGRES_DB")
          [ -n "$POSTGRES_USER" ] && DART_DEFINES+=(--dart-define=POSTGRES_USER="$POSTGRES_USER")
          [ -n "$POSTGRES_PASSWORD" ] && DART_DEFINES+=(--dart-define=POSTGRES_PASSWORD="$POSTGRES_PASSWORD")
          [ -n "$SENDER_EMAIL" ] && DART_DEFINES+=(--dart-define=SENDER_EMAIL="$SENDER_EMAIL")
          [ -n "$BREVO_API_KEY" ] && DART_DEFINES+=(--dart-define=BREVO_API_KEY="$BREVO_API_KEY")
          [ -n "$OPENAI_API_KEY" ] && DART_DEFINES+=(--dart-define=OPENAI_API_KEY="$OPENAI_API_KEY")
          [ -n "$HUGGINGFACE_TOKEN" ] && DART_DEFINES+=(--dart-define=HUGGINGFACE_TOKEN="$HUGGINGFACE_TOKEN")
          flutter build apk --release "${DART_DEFINES[@]}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macromate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
