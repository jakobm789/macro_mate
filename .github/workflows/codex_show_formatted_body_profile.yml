name: Show Formatted Body Profile Setup

on:
  push:
    branches: [codex/show-formatted-body-profile]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: dart format --output=show lib/pages/body_profile_setup_page.dart
