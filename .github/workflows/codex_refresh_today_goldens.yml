name: Refresh Today Goldens

on:
  push:
    branches: [codex/refresh-today-goldens]

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens test/golden_views_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-today-goldens
          path: |
            test/goldens/today_page_light.png
            test/goldens/today_page_dark.png
            test/goldens/today_page_small_phone.png
